<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Depot &mdash; foul ball (404)</title>
<!-- [site chrome] GitHub Pages serves this file for any unknown path. Fully
     self-contained on purpose: a 404 must not depend on the css/js bundles
     whose moved-or-renamed paths may be the very reason we are here. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#f6c81e; --dark:#0a1014; --cream:#f7f0db; --cream-dim:#b3ab93; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--dark); color:var(--cream); font-family:'Press Start 2P',monospace;
        display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box; }
  .card{ border:4px solid var(--gold); border-radius:12px; padding:42px 34px; max-width:560px;
         box-shadow:0 4px 0 rgba(0,0,0,.5); }
  h1{ color:var(--gold); font-size:34px; margin:0 0 18px; letter-spacing:2px; }
  p{ font-size:11px; line-height:2; color:var(--cream-dim); margin:0 0 26px; }
  a.btn{ display:inline-block; color:var(--dark); background:var(--gold); text-decoration:none;
         font-size:11px; letter-spacing:1px; padding:14px 18px; border-radius:6px; }
  a.btn:hover{ filter:brightness(1.08); }
  .ball{ font-size:40px; margin-bottom:18px; }
</style>
</head>
<body>
  <main class="card">
    <div class="ball" aria-hidden="true">&#9918;</div>
    <h1>FOUL BALL</h1>
    <p>404 &mdash; that page is out of play.<br>
       The card you're after may have moved binders.</p>
    <a class="btn" href="/">&larr; BACK TO THE DEPOT</a>
  </main>
</body>
</html>
