<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Depot favicon: a gold-bordered card over the field dark, retro pixel feel. -->
  <rect width="64" height="64" rx="10" fill="#0a1014"/>
  <rect x="6" y="6" width="52" height="52" rx="7" fill="none" stroke="#f6c81e" stroke-width="4"/>
  <!-- card -->
  <rect x="17" y="13" width="30" height="38" rx="3" fill="#f7f0db" stroke="#f6c81e" stroke-width="3"/>
  <!-- baseball -->
  <circle cx="32" cy="27" r="8" fill="#fefefe" stroke="#0a1014" stroke-width="2"/>
  <path d="M27 21.5 q2.5 5.5 0 11 M37 21.5 q-2.5 5.5 0 11" fill="none" stroke="#c8402a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- name bar -->
  <rect x="21" y="40" width="22" height="5" fill="#0a1014"/>
</svg>
