<body class="v2-body">
<script>
  // Mount the shared shell chrome (header + 4-tab nav, unchanged). PACK SHOP is
  // reached from the nav pill on every surface. The old header entry link
  // (depot-shop-entry.js) was an unstyled self-link here and is unwired.
  document.addEventListener('DOMContentLoaded', function () {
    if (window.DepotShell && window.DepotShell.mount) {
      window.DepotShell.mount({ active: 'shop', wordmark: 'THE <b>DEPOT</b>' });
    }
  });
</script>

<style>
  /* [shop boot skeleton] paints with the static HTML, zero JS required, and the
     shared renderer's first render() wipes it via gridEl.innerHTML. Palette-native
     shimmer; motion respects prefers-reduced-motion. */
  .shop-skel{ display:flex; flex-wrap:wrap; gap:18px; justify-content:center; padding:26px 8px; }
  .shop-skel__tile{ width:210px; height:300px; border:3px solid rgba(246,200,30,.35); border-radius:10px;
    background:linear-gradient(100deg, rgba(247,240,219,.05) 38%, rgba(247,240,219,.14) 50%, rgba(247,240,219,.05) 62%);
    background-size:220% 100%; animation:shopSkelShimmer 1.4s linear infinite; }
  .shop-skel__cap{ width:100%; text-align:center; font-family:'Press Start 2P',monospace; font-size:10px;
    letter-spacing:2px; color:#b3ab93; padding-top:6px; }
  @keyframes shopSkelShimmer{ from{ background-position:120% 0; } to{ background-position:-100% 0; } }
  @media (prefers-reduced-motion: reduce){ .shop-skel__tile{ animation:none; } }
</style>
<main class="depot-stage" data-depot-stage>
  <div class="shop-grid" id="shopGrid"><div class="shop-skel" data-shop-skeleton>
    <div class="shop-skel__tile"></div><div class="shop-skel__tile"></div><div class="shop-skel__tile"></div>
    <div class="shop-skel__cap" data-shop-skeleton-cap>STOCKING THE RACK&hellip;</div>
  </div></div>

  <div class="shop-status" id="shopStatus" role="status" aria-live="polite"></div>
</main>

<script>
  /* ONE RENDERER, BOTH SURFACES (feat/pack-shop-redesign).
   * This page used to carry its own forked copy of the tile/odds/free-pack
   * renderer (~230 lines). It drifted from the in-binder PACK SHOP tab and had
   * no rip ceremony at all -- a paid pack here fell through to "saved, opens
   * next load". It now mounts the SHARED DepotShopView, the same renderer the
   * binder tab mounts, so the redesign lands on both surfaces and cannot fork
   * again. All money logic still lives in DepotShop / DepotPackEngine: this
   * file wires nothing to the RPCs itself.
   */
  (function () {
    var LOG = '[depot] shop-page:';
    /* [shop boot skeleton] the static skeleton above holds the stage until the
       shared renderer's first render() replaces gridEl.innerHTML. Two fail-loud
       exits: boot errors swap the skeleton for a visible error line (a shimmer
       that never resolves is a silent guard with better clothes), and a 12s
       watchdog names a stall if the skeleton is still on stage. */
    function skelFail(msg){
      var sk = document.querySelector('[data-shop-skeleton]');
      if (!sk) return;
      sk.innerHTML = '<div class="shop-skel__cap">' + msg + '</div>';
    }
    function boot() {
      var grid = document.getElementById('shopGrid');
      var status = document.getElementById('shopStatus');
      if (!grid) { console.error(LOG + ' #shopGrid missing; shop cannot mount'); return; }
      if (!window.DepotShopView || !window.DepotShopView.mount) {
        console.error(LOG + ' DepotShopView.mount missing (include-order bug); shop cannot mount');
        skelFail('THE RACK DID NOT LOAD &mdash; TRY A HARD REFRESH');
        return;
      }
      window.DepotShopView.mount({ gridEl: grid, statusEl: status, context: 'shop' });
      console.log(LOG + ' mounted the shared pack-shop renderer');
      setTimeout(function(){
        if (document.querySelector('[data-shop-skeleton]')) {
          console.warn(LOG + ' skeleton still on stage 12s after mount - catalog/balance fetch is stalling or threw upstream');
          var cap = document.querySelector('[data-shop-skeleton-cap]');
          if (cap) cap.innerHTML = 'STILL STOCKING&hellip; SLOW CONNECTION OR THE SHOP HIT AN ERROR (SEE CONSOLE)';
        }
      }, 12000);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
