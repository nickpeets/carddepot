<body class="v2-body rd-page">
<script>
/* VS MODE v1 - this surface is READ + ROUTE + SETTLE only. Challenge creation
   stays where the lineup lives (game/builder.html CHALLENGE) and the match is
   still played by the existing two-lineup seeded engine (game/index.html?match=).
   Nothing here duplicates that plumbing. */
document.addEventListener('DOMContentLoaded', function () {
  if (window.DepotShell && window.DepotShell.mount) { window.DepotShell.mount({ active: 'vs', wordmark: 'THE <b>DEPOT</b>' }); }
  else { console.warn('[vs] DepotShell.mount missing; this surface has no header'); }
});
</script>
<main class="depot-stage rd-page__body" data-depot-stage>
<section class="rd-panel">
<div class="rd-panel__h">VS &mdash; CHALLENGE A FRIEND</div>
<p class="rd-panel__note">Build a lineup, send the link, and the two real nines play each other from one seed.
Stakes are <b>FRIENDLY</b>: the winner takes a fixed <span data-vs-purse>&hellip;</span>-coin purse, the loser takes the flat <span data-vs-consolation>&hellip;</span>.
No cards are ever wagered.</p>
<p><a class="rd-btn rd-btn--gold rd-btn--sm" href="game/builder.html">Build a lineup &amp; create a challenge</a></p>
</section>
<section class="rd-panel">
<div class="rd-panel__h">YOUR CHALLENGES</div>
<div id="vsList"><p class="rd-panel__note">Loading&hellip;</p></div>
</section>
</main>
<script>
(function(){
  var TAG='[vs page]';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function team(L,fb){ try{ if(L&&L.teamName) return String(L.teamName); }catch(e){} return fb; }
  function rowHtml(m){
    var st=window.DepotVs.stakesOf(m);
    var c=esc(team(m.challenger_lineup,'Challenger'));
    var o=m.opponent_id?esc(team(m.opponent_lineup,'Opponent')):'<i>waiting for an opponent</i>';
    var act;
    if(m.status==='pending'){ act='<input readonly style="width:100%;max-width:520px" value="'+esc(window.DepotVs.linkFor(m.id))+'">'+
      ' <button class="rd-btn rd-btn--gold rd-btn--sm" type="button" data-share="'+esc(m.id)+'" data-share-team="'+c+'">SHARE</button>'; }
    else if(m.status==='accepted'){ act='<a class="rd-btn rd-btn--gold rd-btn--sm" href="game/index.html?match='+encodeURIComponent(m.id)+'">PLAY MATCH</a>'; }
    else if(m.status==='played'){ var s=m.result&&m.result.final;
      act='FINAL '+(s?(s.challenger+' - '+s.opponent):'?')+' <a class="rd-btn rd-btn--sm" href="game/index.html?match='+encodeURIComponent(m.id)+'">REPLAY</a><span data-settle="'+esc(m.id)+'"></span>'; }
    else { act=esc(m.status); }
    return '<div class="rd-panel rd-panel--sub" style="margin-bottom:10px"><b>'+c+'</b> vs '+o+
      '<div style="margin-top:6px">'+act+'</div>'+
      '<div class="rd-micro rd-micro--orange" style="margin-top:6px">Stakes: FRIENDLY &middot; purse '+st.purse+' / consolation '+st.consolation+'</div></div>';
  }
  function paint(){
    fillStakesCopy();
    var host=document.getElementById('vsList');
    if(!host){ console.warn(TAG,'no #vsList element; nothing rendered'); return; }
    window.DepotVs.listMine().then(function(rows){
      if(!rows.length){ host.innerHTML='<p class="rd-panel__note">No challenges yet. Build a lineup and send someone the link.</p>'; return; }
      host.innerHTML=rows.map(rowHtml).join('');
      /* [challenge share] one delegated handler on the list host (assignment, not
         addEventListener, so a re-paint can never stack duplicates). Native share
         sheet when the platform has one; clipboard fallback; fail-loud. */
      host.onclick=function(ev){
        var b=ev.target && ev.target.closest ? ev.target.closest('[data-share]') : null;
        if(!b){ return; }
        var url=window.DepotVs.linkFor(b.getAttribute('data-share'));
        var team=b.getAttribute('data-share-team')||'A rival club';
        function flash(msg){ b.textContent=msg; setTimeout(function(){ b.textContent='SHARE'; },1600); }
        function copy(){
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(url).then(function(){ flash('COPIED!'); },
              function(e){ console.warn(TAG,'share: clipboard copy failed:', e&&e.message); flash('COPY FAILED'); });
          } else { console.warn(TAG,'share: no navigator.share and no clipboard API on this browser'); flash('COPY FAILED'); }
        }
        if(navigator.share){
          navigator.share({ title:'The Depot — you’ve been challenged',
                            text:team+' challenges you to play ball — one seed, two real nines.', url:url })
            .catch(function(e){
              if(e && e.name==='AbortError'){ return; } // sheet dismissed; not an error
              console.warn(TAG,'share: navigator.share failed, copying instead:', e&&e.message);
              copy();
            });
        } else { copy(); }
      };
      rows.forEach(function(m){
        if(m.status!=='played'){ return; }
        window.DepotVs.settle(m).then(function(r){
          var slot=document.querySelector('[data-settle="'+m.id+'"]');
          if(!slot){ return; }
          if(r.ok&&r.settled){ slot.textContent=' - '+r.label+' +'+r.amount+' coins'; }
          else if(r.ok&&r.noop){ slot.textContent=' - settled ('+r.label+' +'+r.amount+')'; }
          else { slot.textContent=' - settlement waiting on the migration'; }
        });
      });
    });
  }
  function fillStakesCopy(){ var pn=document.querySelector('[data-vs-purse]'), cn=document.querySelector('[data-vs-consolation]'); if(pn){ pn.textContent=String(window.DepotVs.PURSE); } else { console.warn(TAG,'no [data-vs-purse] node; purse copy not filled'); } if(cn){ cn.textContent=String(window.DepotVs.CONSOLATION); } else { console.warn(TAG,'no [data-vs-consolation] node; consolation copy not filled'); } }
  function boot(t){ t=t||0;
    if(window.DepotVs){ paint(); return; }
    if(t>40){ console.warn(TAG,'DepotVs never loaded; list not rendered'); return; }
    setTimeout(function(){ boot(t+1); },150);
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',function(){ boot(0); }); } else { boot(0); }
})();
</script>
</body>
